apply plugin: 'com.android.application'

android {
    namespace 'sg.rj.jarviswatch'
    compileSdk 34

    defaultConfig {
        applicationId "sg.rj.jarviswatch"
        minSdk 30        // Wear OS 3+
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
// no external dependencies - plain Activity + org.json + HttpURLConnection
